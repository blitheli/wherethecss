name: 每日更新 CMSE 轨道与新闻

on:
  schedule:
    # 每天 02:30 UTC（约北京时间 10:30）；CMSE 通常周一/三/五发布 OEM
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch OEM + news
        run: |
          node scripts/fetch-cmse-oem.mjs
          node scripts/fetch-cmse-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/css-oem-latest.json public/data/css-oem-meta.json public/data/cmse-news.json
          if git diff --staged --quiet; then
            echo "无数据变更"
          else
            git commit -m "chore: 每日更新 CMSE OEM 与综合新闻"
            git push
          fi
